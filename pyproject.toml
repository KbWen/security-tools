[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostcheck"
version = "1.2.2"
description = "AI-era security scanner for developers"
authors = [
    { name = "KbWen", email = "kbwen@example.com" }
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
dependencies = [
    "esprima>=4.0.1",
    "requests>=2.25.1",
    "tomli; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/KbWen/security-tools"
Repository = "https://github.com/KbWen/security-tools"
"Bug Tracker" = "https://github.com/KbWen/security-tools/issues"
Changelog = "https://github.com/KbWen/security-tools/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
ghostcheck = "ghostcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ghostcheck" = ["data/*.json", "data/**/*.json", "data/demo_fixtures/*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
